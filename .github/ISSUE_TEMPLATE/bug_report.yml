name: Bug report
description: Report a reproducible TB2 bug or regression
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce it.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What broke?
      placeholder: bridge_start fails when...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, backend, CLI client, transport path, and install method
      placeholder: |
        Ubuntu on WSL2
        Python 3.12
        backend=tmux
        transport=room_poll / SSE / WebSocket / MCP
        profile=codex
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: tb2 doctor --json output
      description: Run `python -m tb2 doctor --json` and paste the full JSON output. Redact local paths only if needed.
      render: json
    validations:
      required: true
  - type: textarea
    id: release_check
    attributes:
      label: Local release check output
      description: If this is a repo checkout or regression report, run `python3 tools/release_check.py --skip-tests` or the full `python3 tools/release_check.py`.
      render: shell
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Start ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
